# assets/video-clips.yaml
# Timestamped moments in assets/video/, so a session picks a held frame without guessing.
# Built 2026-11-20 from 4 sampled frames per clip plus a camera-motion check.
#
# camera:   locked  = tripod or near-still: good postcard as is
#           drift   = small handheld drift: OK once cropped; try `stabilize: true` in the recipe and check the result
#           moving  = the camera follows or pushes in: use only the segment given, or not as a postcard
# postcard: true = can carry an R1 postcard (something moves on its own, frame can be held)
# master:   a higher-resolution source exists (use it for tight crops)
# Timestamps are approximate: check in an editor or a test render before cutting.

videos:
  # ------------------------------------------------------------ denim walk (iPhone)
  - id: zaf-video-001
    camera: moving
    postcard: false
    clips:
      - { in: "00:10", out: "00:18", content: "from behind: flower patch on the back pocket, tan bag of bottles", note: "Camera follows the walker. Use only as a cut-in, 2 to 3 s, held crop on the bag." }
    master: "4K original IMG_3759.MOV (Emi's local download)"
  - id: zaf-video-002

# assets/index.yaml
# Index of every asset in assets/photos, assets/video, assets/logos, assets/fonts, assets/reference.
# One entry per asset so AI can find the right one without guessing.
#
# STATUS (2026-11-18): logos (6 versions x SVG/PDF/EPS/PNG), Rubik fonts, palette sheet,
# 97 photos, 42 videos, 39 past Instagram posts, 1 stock reference.
# Photos are web copies (long edge 2048 px); videos are H.264, 1080p, 30 fps.
# Full-res originals: `original` (Drive link where the file is in the Drive folder).
# Rights: Zafra owns the rights to all people in its photos and videos.
# `brand_book_fit` = Bower's read against brand book v1.2 photography rules.
# Shoots: studio | factory-italy | denim-iphone | beach-iphone | pool-iphone |
#         hands-iphone | instagram-archive | stock
# pillar = slug from brand/pillars.md (quiet-saffron-luxury | modern-ritual | saffron-explained |
#          where-to-find-us | heritage-not-hype)
# Clip moments, camera check and postcard picks: assets/video-clips.yaml. Crop recipes: assets/reuse-ideas.md.
# Masters (full resolution, for tight crops): assets/video/masters/.
#
# Schema per asset:
#   id: zaf-<type>-<nnn>
#   file: path relative to assets/ (e.g. photos/zaf-photo-001.jpg)
#   type, shoot, orientation, size_px, duration_s, source_file, original, brand_book_fit
#   description: short, plain description of what the asset is
#   usage_rule: when this specific asset is allowed to be used
#   tags: list of descriptive tags
#   product: product id from products/products.yaml, or null
#   pillar: slug from brand/pillars.md, or null
#   used_in: list of content/drafts or content/approved files this asset is used in
#   times_used: number of pieces (bump on every use)
#   last_used: null
#   master: path to a full-resolution copy in assets/video/masters/, if any
#
